// ---------- props: code/props/*.js register into window.KO_PROPS[name] = { build, poses, armBase, lookTargets, handPoints, koFx, update } (props/README.md)
const KX = { THREE, scene, cam, renderer, V, obj, put, link, RB, BX, CY, SP, glowMat, PAL, COMIC, dpr, INK, LIME, clamp, seg, out3, backOut, rmsAt, TL, CU, W, H,
  up, head, arms, GUY, LAP, lid, koG, sq, KOX, KS, KD, Y, handRest, qFP, yawTo, YAW_KO, YAW_SCR, CAMS, POSE, lookW, gMax, gAmp, keySpot, FILL, FOCUS };
const PROPS = Object.entries(window.KO_PROPS || {});
const OLD = new Set(); scene.traverse(o => OLD.add(o));
PROPS.forEach(([, p]) => p.build && p.build(KX));
if (!COMIC) scene.traverse(o => { if (!OLD.has(o) && o.isMesh && o.material && o.material.isMeshStandardMaterial) { o.castShadow = true; o.receiveShadow = true; } });   // props built after the base shadow pass
PROPS.forEach(([, p]) => p.poses && Object.assign(POSE, p.poses(KX)));
const ARMT = Object.keys(POSE);
const LT = {}; PROPS.forEach(([, p]) => p.lookTargets && Object.assign(LT, p.lookTargets(KX)));   // name -> { yaw, pitch } for look.at
const HPTS = [0, 1].map(i => PROPS.flatMap(([, p]) => (p.handPoints && p.handPoints(i, KX)) || []));   // hand-local points of held props (clearance + framing checks)

const { TC, TH, HH } = G, ZERO = V(0, 0, 0);

function build() {
